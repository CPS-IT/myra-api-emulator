name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # composer.json pins platform.php to 8.2.0 for local installs; each row resolves for its own PHP.
      - run: composer config platform.php ${{ matrix.php }}.0
      - run: composer update --no-interaction --no-progress
      # validate --strict, lint, PHP-CS-Fixer, PHPStan, tests
      - run: composer ci
